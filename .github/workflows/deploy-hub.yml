name: Deploy JoJo Hub

on:
  push:
    branches: [main]
    paths:
      - 'jojos-core/**'
      - 'jojos-ui/**'
      - 'deploy/**'
      - '.github/workflows/deploy-hub.yml'
  workflow_dispatch:

concurrency:
  group: jojos-hub-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to store hub
    runs-on: [self-hosted, linux, x64, jojos-hub]
    timeout-minutes: 20
    env:
      JOJOS_CENTRAL_BASE_URL: https://base.jojos.kz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup runtime data
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP_DIR="/home/admini/jojos-backups/hub/${TS}"
          mkdir -p "$BACKUP_DIR"
          [ -f /home/admini/jojos-core/jojos_core.db ] && cp -a /home/admini/jojos-core/jojos_core.db "$BACKUP_DIR/" || true
          [ -d /home/admini/jojos-core/config ] && cp -a /home/admini/jojos-core/config "$BACKUP_DIR/" || true
          [ -d /home/admini/jojos-core/data ] && cp -a /home/admini/jojos-core/data "$BACKUP_DIR/" || true
          echo "Backup: $BACKUP_DIR"

      - name: Deploy backend source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /home/admini/jojos-core
          rsync -a --delete \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'jojos_core.db' \
            --exclude 'config/' \
            --exclude 'data/' \
            --exclude 'static/' \
            --exclude '__pycache__/' \
            ./jojos-core/ /home/admini/jojos-core/

      - name: Update Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /home/admini/jojos-core
          if [ ! -x venv/bin/python ]; then
            python3 -m venv venv
          fi
          if [ -f requirements.txt ]; then
            venv/bin/pip install -r requirements.txt
          fi
          venv/bin/python -m compileall app

      - name: Set up Node for legacy web fallback
        if: hashFiles('jojos-ui/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jojos-ui/package-lock.json

      - name: Build legacy web fallback
        if: hashFiles('jojos-ui/package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd jojos-ui
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          rm -rf /home/admini/jojos-core/static
          mkdir -p /home/admini/jojos-core/static
          cp -a dist/. /home/admini/jojos-core/static/

      - name: Restart JoJo Core
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl restart jojos-core.service

      - name: Check local port 80 gateway
        shell: bash
        run: |
          set -euo pipefail
          if systemctl is-active --quiet jojos-http-proxy.socket; then
            echo "Hub local gateway is active on port 80."
          elif systemctl cat jojos-http-proxy.socket >/dev/null 2>&1; then
            echo "WARNING: jojos-http-proxy.socket is installed but inactive. Run once on Hub: sudo systemctl enable --now jojos-http-proxy.socket"
          else
            echo "WARNING: local port 80 gateway is not installed. Run the Hub bootstrap once with sudo."
          fi

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health >/tmp/jojos-health.json; then
              cat /tmp/jojos-health.json
              if systemctl is-active --quiet jojos-http-proxy.socket; then
                curl -fsS http://127.0.0.1/api/health >/tmp/jojos-health-port80.json
                echo "Core and local port 80 gateway are healthy."
              else
                echo "Core is healthy; port 80 gateway needs one-time local sudo activation."
              fi
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status jojos-core.service --no-pager || true
          exit 1

      - name: Configure protected Central Base
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -X POST \
            http://127.0.0.1:8080/api/central/config \
            -H 'Content-Type: application/json' \
            --data "{\"base_url\":\"${JOJOS_CENTRAL_BASE_URL}\"}")"
          python3 -c 'import json,sys; d=json.loads(sys.stdin.read()); print(json.dumps({"status":d.get("status"),"base_url":(d.get("config") or {}).get("base_url"),"sync_status":(d.get("sync") or {}).get("status"),"hub_status":(d.get("sync") or {}).get("hub_status"),"store_id":(d.get("sync") or {}).get("store_id")}, ensure_ascii=False))' <<<"$RESPONSE"
          STATUS="$(curl -fsS http://127.0.0.1:8080/api/central/status)"
          python3 -c 'import json,os,sys; d=json.loads(sys.stdin.read()); expected=os.environ["JOJOS_CENTRAL_BASE_URL"]; actual=d.get("base_url"); assert actual==expected, f"Central Base URL mismatch: {actual} != {expected}"; print("Central Base URL pinned to HTTPS")' <<<"$STATUS"

      - name: Apply centrally managed Wi-Fi if installed
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /usr/local/sbin/jojos-apply-central-network ] && systemctl cat jojos-network-sync.service >/dev/null 2>&1; then
            if sudo -n systemctl start jojos-network-sync.service 2>/dev/null; then
              echo "Central Base Wi-Fi policy applied."
            else
              echo "Central Wi-Fi sync is installed; policy will apply by its path/timer service."
            fi
          else
            echo "Central Wi-Fi sync helper is not installed yet; run deploy/install-network-sync.sh once with sudo on the Hub."
          fi
